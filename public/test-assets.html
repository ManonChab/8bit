<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>8bit — PixelLab asset test</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: #14151a;
    color: #e8e8e8;
    font-family: 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }
  h1 { font-size: 13px; opacity: 0.6; font-weight: normal; letter-spacing: 0.1em; text-transform: uppercase; }
  /* Background and character are displayed at the same 6x-native-pixel
     scale so relative sizes stay meaningful. */
  #stage {
    position: relative;
    width: 768px;  /* 128px background native width * 6 */
    height: 672px; /* 112px background native height * 6 */
    border: 3px solid #3a3d4a;
    border-radius: 4px;
    overflow: hidden;
  }
  #stage img {
    image-rendering: pixelated;
  }
  #bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 768px;
    height: 672px;
  }
  #sprite {
    position: absolute;
    width: 384px;  /* 64px character native * 6 */
    height: 384px;
    right: 48px;
    bottom: 0;
  }
  #buttons { display: flex; gap: 8px; }
  #buttons button {
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    background: #1f2129;
    color: #cfd2dc;
    border: 2px solid #3a3d4a;
    border-radius: 4px;
    padding: 8px 16px;
    cursor: pointer;
  }
  #buttons button:hover { border-color: #7fd17f; }
  #buttons button.active { border-color: #7fd17f; color: #7fd17f; }
  #anim-toggle {
    font-size: 11px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #cfd2dc;
    opacity: 0.8;
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <h1>developer theme — pixellab v2 (uniformized)</h1>
  <div id="stage">
    <img id="bg" src="/art/developer-theme/pixellab/v2/background/background.png" alt="background" />
    <img id="sprite" src="/art/developer-theme/pixellab/v2/character/idle.png" alt="developer character" />
  </div>
  <div id="buttons">
    <button data-state="idle" class="active">Idle</button>
    <button data-state="working">Working</button>
    <button data-state="error">Error</button>
  </div>
  <label id="anim-toggle">
    <input type="checkbox" id="anim-checkbox" checked />
    animate (PixelLab animate-with-text-v3)
  </label>

  <script>
    const sprite = document.getElementById('sprite');
    const animCheckbox = document.getElementById('anim-checkbox');

    // Last index in each state's animate-with-text-v3 output
    // (frame-0.png..frame-N.png, N = frame_count -- see animations/NOTES.md).
    const ANIM_LAST_FRAME = { idle: 4, working: 8, error: 8 };
    const FRAME_MS = 140; // ~7fps, readable at pixel-art scale

    let currentState = 'idle';
    let frameIndex = 0;
    let timer = null;

    function framePath(state, index) {
      return `/art/developer-theme/pixellab/v2/animations/${state}/frame-${index}.png`;
    }

    function stopAnim() {
      if (timer) clearInterval(timer);
      timer = null;
    }

    function startAnim() {
      stopAnim();
      frameIndex = 0;
      timer = setInterval(() => {
        frameIndex = (frameIndex + 1) % (ANIM_LAST_FRAME[currentState] + 1);
        sprite.src = framePath(currentState, frameIndex);
      }, FRAME_MS);
    }

    function render() {
      if (animCheckbox.checked) {
        startAnim();
      } else {
        stopAnim();
        sprite.src = `/art/developer-theme/pixellab/v2/character/${currentState}.png`;
      }
    }

    document.querySelectorAll('#buttons button').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#buttons button').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        currentState = btn.dataset.state;
        render();
      });
    });

    animCheckbox.addEventListener('change', render);

    render();
  </script>
</body>
</html>
