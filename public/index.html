<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>8bit — Session Avatar</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: #14151a;
    color: #e8e8e8;
    font-family: 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }
  canvas { image-rendering: pixelated; }
  #stage {
    background: #1f2129;
    border: 3px solid #3a3d4a;
    border-radius: 4px;
  }
  #picker { display: flex; gap: 20px; align-items: center; }
  #picker[hidden] { display: none; }
  .choice {
    cursor: pointer;
    background: #1f2129;
    border: 3px solid #3a3d4a;
    border-radius: 4px;
    padding: 10px;
    text-align: center;
  }
  .choice:hover { border-color: #7fd17f; }
  #label { font-size: 12px; opacity: 0.75; letter-spacing: 0.05em; }
  h1 { font-size: 14px; opacity: 0.6; font-weight: normal; letter-spacing: 0.1em; text-transform: uppercase; }
  #style-btn {
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    background: #1f2129;
    color: #cfd2dc;
    border: 2px solid #3a3d4a;
    border-radius: 4px;
    padding: 6px 12px;
    cursor: pointer;
  }
  #style-btn:hover { border-color: #7fd17f; }
  #bg-btn {
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    background: #1f2129;
    color: #cfd2dc;
    border: 2px solid #3a3d4a;
    border-radius: 4px;
    padding: 6px 12px;
    cursor: pointer;
  }
  #bg-btn:hover { border-color: #7fd17f; }
  #buttons { display: flex; gap: 8px; }
  #bg-picker { display: flex; gap: 20px; align-items: center; }
  #bg-picker[hidden] { display: none; }
</style>
</head>
<body>
  <h1>8bit — session avatar</h1>

  <div id="picker" hidden>
    <div class="choice" data-style="a">
      <canvas id="preview-a" width="100" height="130"></canvas>
      <div>Style A</div>
    </div>
    <div class="choice" data-style="b">
      <canvas id="preview-b" width="100" height="130"></canvas>
      <div>Style B</div>
    </div>
  </div>

  <div id="bg-picker" hidden>
    <div class="choice" data-background="none">
      <canvas id="preview-bg-none" width="90" height="70"></canvas>
      <div>None</div>
    </div>
    <div class="choice" data-background="developer">
      <canvas id="preview-bg-developer" width="90" height="70"></canvas>
      <div>Developer</div>
    </div>
  </div>

  <canvas id="stage" width="220" height="190" hidden></canvas>
  <div id="buttons">
    <button id="style-btn" hidden>Style</button>
    <button id="bg-btn" hidden>Background</button>
  </div>
  <div id="label"></div>

  <script src="avatar.js"></script>
</body>
</html>
