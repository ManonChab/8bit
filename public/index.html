<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Live Session</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: #14151a;
    color: #e8e8e8;
    font-family: 'Courier New', monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }
  canvas, img { image-rendering: pixelated; }
  #stage {
    display: block;
    background: #1f2129;
    border: 3px solid #3a3d4a;
    border-radius: 4px;
  }
  #stage-wrap { position: relative; }
  #stage-wrap[hidden] { display: none; }
  #picker { display: flex; gap: 20px; align-items: center; }
  #picker[hidden] { display: none; }
  .choice {
    cursor: pointer;
    background: #1f2129;
    border: 3px solid #3a3d4a;
    border-radius: 4px;
    padding: 10px;
    text-align: center;
  }
  .choice:hover { border-color: #7fd17f; }
  #label { font-size: 12px; opacity: 0.75; letter-spacing: 0.05em; }
  h1 { font-size: 26px; opacity: 0.85; font-weight: normal; letter-spacing: 0.1em; text-transform: uppercase; }
  #buttons button, #picker-return-btn, #test-state-panel button {
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    background: #1f2129;
    color: #cfd2dc;
    border: 2px solid #3a3d4a;
    border-radius: 4px;
    padding: 6px 12px;
    cursor: pointer;
  }
  #buttons button:hover, #picker-return-btn:hover, #test-state-panel button:hover { border-color: #7fd17f; }
  #picker-return-btn[hidden] { display: none; }
  #buttons { display: flex; gap: 8px; }
  #test-state-panel { display: flex; gap: 8px; }
  #test-state-panel[hidden] { display: none; }
  /* Small pixel-art icon button, overlaid on the stage corner rather than
     sitting in the button row -- flat rectangular border (no radius) and a
     hard 2px outline to read as a retro in-scene UI element. */
  .icon-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 28px;
    height: 28px;
    padding: 0;
    background: #1f2129;
    border: 2px solid #0d0e12;
    box-shadow: inset 0 0 0 1px #4a4d5a;
    border-radius: 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-btn:hover { box-shadow: inset 0 0 0 1px #7fd17f; }
  .icon-btn canvas { width: 16px; height: 16px; }
  #skills-panel {
    display: flex;
    gap: 12px;
    width: min(640px, 92vw);
    max-height: 320px;
  }
  #skills-panel[hidden] { display: none; }
  #skills-list {
    flex: 0 0 220px;
    overflow-y: auto;
    background: #1f2129;
    border: 2px solid #3a3d4a;
    border-radius: 4px;
    padding: 6px;
  }
  .skill-item {
    padding: 8px;
    border-radius: 3px;
    cursor: pointer;
    margin-bottom: 4px;
  }
  .skill-item:hover, .skill-item.active { background: #2a2d3a; }
  .skill-item { box-sizing: border-box; overflow: hidden; }
  .skill-item .skill-name { font-size: 12px; color: #e8e8e8; }
  .skill-item .skill-desc {
    font-size: 10px;
    opacity: 0.65;
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .skill-scope {
    display: inline-block;
    font-size: 9px;
    text-transform: uppercase;
    opacity: 0.6;
    border: 1px solid #3a3d4a;
    border-radius: 3px;
    padding: 1px 4px;
    margin-left: 4px;
  }
  #skills-detail {
    flex: 1;
    overflow-y: auto;
    background: #1f2129;
    border: 2px solid #3a3d4a;
    border-radius: 4px;
    padding: 12px;
    font-size: 11px;
    line-height: 1.5;
  }
  #skills-detail pre { white-space: pre-wrap; word-wrap: break-word; font-family: inherit; }
  #skills-detail .empty { opacity: 0.5; }
  #copy-invoke-btn {
    font-family: inherit;
    font-size: 10px;
    background: #2a2d3a;
    color: #cfd2dc;
    border: 1px solid #3a3d4a;
    border-radius: 3px;
    padding: 4px 8px;
    cursor: pointer;
    margin-bottom: 8px;
  }
  #copy-invoke-btn:hover { border-color: #7fd17f; }
</style>
</head>
<body>
  <h1>Live Session</h1>

  <div id="picker" hidden>
    <div class="choice" data-style="developer">
      <img src="/art/developer-theme/pixellab/v2/portrait/portrait.png" alt="Developer portrait" width="192" height="192" />
      <div>Developer</div>
    </div>
    <button id="picker-return-btn" hidden>Return</button>
  </div>

  <div id="stage-wrap" hidden>
    <canvas id="stage" width="220" height="190"></canvas>
    <button id="skills-btn" class="icon-btn" aria-label="Skills">
      <canvas id="skills-icon" width="16" height="16"></canvas>
    </button>
  </div>
  <div id="buttons">
    <button id="style-btn" hidden>Style</button>
    <!-- TEMPORARY dev tool: preview a state's animation without a real hook
         event. Remove this button + #test-state-panel when done testing. -->
    <button id="test-state-btn" hidden>Test States</button>
  </div>
  <div id="test-state-panel" hidden>
    <button data-test-state="idle">Idle</button>
    <button data-test-state="active">Working</button>
    <button data-test-state="error">Error</button>
  </div>
  <div id="label"></div>

  <div id="skills-panel" hidden>
    <div id="skills-list"></div>
    <div id="skills-detail"><span class="empty">Select a skill to view details.</span></div>
  </div>

  <script src="avatar.js"></script>
  <script src="skills.js"></script>
</body>
</html>
